services:
  legal-api-ts:
    image: ghcr.io/city-of-franklin-it/legal-api-ts:1.0.0
    restart: unless-stopped
    environment:
      - BASE_URL=${BASE_URL}
      - HOST=${HOST}
      - PORT=${PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CITY_LAW_DB_HOST=${CITY_LAW_DB_HOST}
      - CITY_LAW_DB_DATABASE=${CITY_LAW_DB_DATABASE}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    volumes:
      - /mnt/City_Law:/mnt/City_Law
      - /opt/docs:/opt/docs
    user: "1001:1001"
    command: ["sh", "-c", "exec node dist/app.js"]